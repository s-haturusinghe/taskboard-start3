<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Task Board</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Pull in the shared navbar from base.html -->
<div th:replace="~{layout/base :: navbar}"></div>

<div class="container mt-4">

    <p th:if="${#lists.isEmpty(tasks)}">No tasks found.</p>

    <table class="table" th:unless="${#lists.isEmpty(tasks)}">
        <thead>
        <tr>
            <th>Title</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="task : ${tasks}">
            <td th:text="${task.title}">Title</td>
            <td th:text="${task.status}">Status</td>
            <td>
                <a th:href="@{/tasks/{id}(id=${task.id})}">View</a>
            </td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-primary mt-3" th:href="@{/tasks/new}">+ New Task</a>
</div>

</body>
</html>
