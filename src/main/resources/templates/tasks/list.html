<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Board</title>
</head>
<body>

<h1>Task Board</h1>



<!-- ── Empty state: shown only when the tasks list is empty ──────── -->
<p th:if="${#lists.isEmpty(tasks)}">
    No tasks yet. <a th:href="@{/tasks/new}">Create your first task.</a>
</p>

<!-- ── Task table: shown only when tasks exist ───────────────────── -->
<table th:unless="${#lists.isEmpty(tasks)}" border="1" cellpadding="8">
    <thead>
    <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Due Date</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <!-- th:each iterates the "tasks" model attribute -->
    <!-- "task" is the loop variable name — your choice -->
    <tr th:each="task : ${tasks}">
        <td th:text="${task.title}">Placeholder title</td>
        <td th:text="${task.status}">TODO</td>
        <td th:text="${task.dueDate}">2025-01-01</td>
        <td>
            <!--
                @{/tasks/{id}(id=${task.id})} builds the URL:
                  - /tasks/{id}    is the path template
                  - (id=${...})    substitutes the variable
                Result: /tasks/1, /tasks/2, etc.
            -->
            <a th:href="@{/tasks/{id}(id=${task.id})}">View</a>
        </td>
    </tr>
    </tbody>
</table>

<br>
<a th:href="@{/tasks/new}">+ Add New Task</a>

</body>
</html>
